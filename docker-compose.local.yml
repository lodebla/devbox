name: omp-devbox
services:
  devbox:
    build:
      context: .
      args:
        BUN_VERSION: "1.4.4"
        OMP_VERSION: "latest"
      secrets:
        - source: tern_archive
          target: tern_${TERN_ARCH:-amd64}
    image: omp-devbox:local
    container_name: omp-devbox
    hostname: omp-devbox
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      TZ: Europe/Rome
      PUID: "1000"
      PGID: "1000"
      DEVBOX_AUTHORIZED_KEYS: "${DEVBOX_AUTHORIZED_KEYS:-}"
      DEVBOX_VNC_PASSWORD: "${DEVBOX_VNC_PASSWORD:-}"
      DEVBOX_GUI_URL: "${DEVBOX_GUI_URL:-}"
      DEVBOX_PANEL_URL: "${DEVBOX_PANEL_URL:-}"
    ports:
      - "2222:22"
      - "6080:6080"
      - "7690:7690"
      - "8376:8376/udp"
    volumes:
      - ./data/persist:/persist
      - ./data/workspace:/workspace
      - ./data/zima-admin-exchange:/zima-exchange

  zima-admin:
    build:
      context: .
      dockerfile: host-admin/Dockerfile
    image: omp-zima-admin:local
    container_name: zima-admin
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ./data/zima-admin-private:/private
      - ./data/zima-admin-exchange:/exchange

secrets:
  tern_archive:
    file: "${TERN_ARCHIVE:-./tern-amd64.tar.gz}"
