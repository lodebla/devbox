# Devbox tmux defaults.
# Mouse mode makes touch/scroll-wheel gestures enter tmux copy-mode instead of
# being forwarded to terminal apps such as OMP as Up/Down key presses.
set -g mouse on

# Termius commonly identifies itself as xterm-256color. Explicitly advertise
# true-colour support so TUIs keep their intended colour rendering inside tmux.
set -as terminal-features ',xterm-256color:RGB'
