# Server-only OMP settings overlay. The current released OMP browser tool does
# not yet document an external CDP target, so the built-in browser is disabled
# here to avoid accidentally opening a second, invisible Chromium instance.
# The shared visible Chromium is exposed to OMP through Chrome DevTools MCP.
browser:
  enabled: false

# Share every interactive OMP session through Collab with full control so a
# phone browser can join it. `omp-qr` prints the join QR for any session.
collab:
  autoStart: control

# Image-owned skills (e.g. devbox-sessions: start sessions / send slash
# commands from the Collab chat). Kept outside ~/.omp so config sync stays clean.
skills:
  customDirectories:
    - /etc/devbox/skills
